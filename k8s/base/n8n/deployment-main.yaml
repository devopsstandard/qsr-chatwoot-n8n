apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n-main
  namespace: default
  labels:
    app.kubernetes.io/name: n8n
    app.kubernetes.io/component: main
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: n8n
      app.kubernetes.io/component: main
  template:
    metadata:
      labels:
        app.kubernetes.io/name: n8n
        app.kubernetes.io/component: main
    spec:
      serviceAccountName: cloudsql-proxy-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      nodeSelector:
        workload-type: ondemand
      containers:
        # n8n Main Webhook & UI Container
        - name: n8n-main
          image: us-central1-docker.pkg.dev/festive-ally-443007-r4/qsr-containers-prod/n8n:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5678
              name: http
          env:
            - name: N8N_PORT
              value: "5678"
            - name: DB_TYPE
              value: "postgresdb"
            - name: DB_POSTGRESDB_HOST
              value: "127.0.0.1" # Connecting via Cloud SQL Proxy sidecar
            - name: DB_POSTGRESDB_PORT
              value: "5432"
            - name: DB_POSTGRESDB_DATABASE
              value: "n8n_production"
            - name: EXECUTIONS_MODE
              value: "queue"
            - name: N8N_HOST
              value: "n8n.devopsstandard.name.ng"
            - name: N8N_PROTOCOL
              value: "https"
            - name: WEBHOOK_URL
              value: "https://n8n.devopsstandard.name.ng/"
            - name: AGENTOPS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: agentops-api-key
                  key: agentops-api-key
                  optional: true
            - name: SLACK_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: slack-bot-token
                  key: slack-bot-token
                  optional: true
            - name: SLACK_SIGNING_SECRET
              valueFrom:
                secretKeyRef:
                  name: slack-signing-secret
                  key: slack-signing-secret
                  optional: true
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "2Gi"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 5678
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 5678
            initialDelaySeconds: 30
            periodSeconds: 15

        # Cloud SQL Auth Proxy Sidecar for n8n DB
        - name: cloud-sql-proxy
          image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.11.0
          args:
            - "--structured-logs"
            - "--port=5432"
            - "qsr-platform-prod:us-central1:qsr-sql-n8n-prod"
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
