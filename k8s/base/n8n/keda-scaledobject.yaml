apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: n8n-queue-scaler
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: n8n-worker
  minReplicaCount: 1
  maxReplicaCount: 20
  cooldownPeriod: 180
  pollingInterval: 10
  triggers:
    - type: redis
      metadata:
        addressFromEnv: REDIS_HOST
        port: "6379"
        listName: "bull:jobs:wait"
        listLength: "5"
        enableTLS: "true"
