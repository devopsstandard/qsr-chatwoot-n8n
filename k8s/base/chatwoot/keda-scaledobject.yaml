apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: chatwoot-sidekiq-scaler
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: chatwoot-worker
  minReplicaCount: 1
  maxReplicaCount: 15
  cooldownPeriod: 300
  pollingInterval: 15
  triggers:
    - type: redis
      metadata:
        addressFromEnv: REDIS_HOST
        port: "6379"
        listName: "queue:default"
        listLength: "10"
        enableTLS: "true"
