apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: gcp-secret-provider
  namespace: default
spec:
  provider: gcp
  parameters:
    secrets: |
      - resourceName: "projects/festive-ally-443007-r4/secrets/agentops-api-key-prod/versions/latest"
        fileName: "agentops-api-key"
      - resourceName: "projects/festive-ally-443007-r4/secrets/slack-bot-token-prod/versions/latest"
        fileName: "slack-bot-token"
      - resourceName: "projects/festive-ally-443007-r4/secrets/slack-signing-secret-prod/versions/latest"
        fileName: "slack-signing-secret"
      - resourceName: "projects/festive-ally-443007-r4/secrets/chatwoot-secret-key-base-prod/versions/latest"
        fileName: "chatwoot-secret-key-base"
      - resourceName: "projects/festive-ally-443007-r4/secrets/n8n-encryption-key-prod/versions/latest"
        fileName: "n8n-encryption-key"
