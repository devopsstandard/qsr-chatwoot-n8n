name: Terraform Infrastructure Pipeline

on:
  push:
    branches: [ main, dev ]
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform-infra.yaml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  GCP_REGION: us-central1
  GCP_PROJECT: ${{ secrets.GCP_PROJECT_ID || 'festive-ally-443007-r4' }}
  GCP_PROJECT_NUMBER: ${{ secrets.GCP_PROJECT_NUMBER || '1056322721883' }}

jobs:
  terraform-apply:
    name: Terraform Init, Plan & Apply
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure Dynamic Environment Context
        run: |
          ENV_NAME="${{ github.ref_name == 'main' && 'prod' || 'dev' }}"
          echo "ENV_NAME=${ENV_NAME}" >> $GITHUB_ENV
          echo "WIF_PROVIDER=projects/${{ env.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github-actions-pool-${ENV_NAME}/providers/github-actions-provider" >> $GITHUB_ENV
          echo "WIF_SERVICE_ACCOUNT=qsr-cicd-sa-${ENV_NAME}@${{ env.GCP_PROJECT }}.iam.gserviceaccount.com" >> $GITHUB_ENV

      - name: Authenticate to GCP via WIF
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      - name: Terraform Init & Apply
        run: |
          echo "==> Running Terraform Apply for environment: ${ENV_NAME}"
          cd terraform/environments/${ENV_NAME}
          terraform init
          terraform apply -auto-approve
