name: Build, Vulnerability Scan & Cosign KMS Sign

on:
  push:
    branches: [ main, dev ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  GCP_REGION: us-central1

jobs:
  build-scan-sign:
    name: Build, Scan & Cosign KMS Sign
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [chatwoot, n8n]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure Dynamic Environment Context
        run: |
          PROJ_ID="${{ secrets.GCP_PROJECT_ID }}"
          if [ -z "$PROJ_ID" ]; then PROJ_ID="festive-ally-443007-r4"; fi
          echo "GCP_PROJECT=${PROJ_ID}" >> $GITHUB_ENV

          PROJ_NUM="${{ secrets.GCP_PROJECT_NUMBER }}"
          if [ -z "$PROJ_NUM" ]; then PROJ_NUM="1056322721883"; fi
          echo "GCP_PROJECT_NUMBER=${PROJ_NUM}" >> $GITHUB_ENV

          ENV_NAME="${{ github.ref_name == 'main' && 'prod' || 'dev' }}"
          echo "ENV_NAME=${ENV_NAME}" >> $GITHUB_ENV
          echo "AR_REPOSITORY=${GCP_REGION}-docker.pkg.dev/${PROJ_ID}/qsr-containers-${ENV_NAME}" >> $GITHUB_ENV
          echo "WIF_PROVIDER=projects/${PROJ_NUM}/locations/global/workloadIdentityPools/github-actions-pool-${ENV_NAME}/providers/github-actions-provider" >> $GITHUB_ENV
          echo "WIF_SERVICE_ACCOUNT=qsr-cicd-sa-${ENV_NAME}@${PROJ_ID}.iam.gserviceaccount.com" >> $GITHUB_ENV
          echo "KMS_KEY_ID=gcpkms://projects/${PROJ_ID}/locations/${GCP_REGION}/keyRings/qsr-keyring-${ENV_NAME}/cryptoKeys/cosign-signing-key/cryptoKeyVersions/1" >> $GITHUB_ENV

      - name: Authenticate to GCP (WIF with SA Key Bootstrap Fallback)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          workload_identity_provider: ${{ secrets.GCP_SA_KEY == '' && env.WIF_PROVIDER || '' }}
          service_account: ${{ secrets.GCP_SA_KEY == '' && env.WIF_SERVICE_ACCOUNT || '' }}
          token_format: 'access_token'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GCP Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GCP_REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Build & Push Docker Container Image
        id: build-push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ env.AR_REPOSITORY }}/${{ matrix.service }}:${{ env.ENV_NAME }}
            ${{ env.AR_REPOSITORY }}/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Vulnerability Scan (Trivy CVE Audit)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.AR_REPOSITORY }}/${{ matrix.service }}:${{ env.ENV_NAME }}
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          scanners: 'vuln'
          severity: 'CRITICAL,HIGH'

      - name: Install Sigstore Cosign
        uses: sigstore/cosign-installer@v3.5.0

      - name: Sign Container Image with Cloud KMS (Cosign)
        run: |
          IMAGE_DIGEST="${{ env.AR_REPOSITORY }}/${{ matrix.service }}@${{ steps.build-push.outputs.digest }}"
          echo "==> Signing image digest: ${IMAGE_DIGEST} with KMS key..."
          cosign sign --key ${{ env.KMS_KEY_ID }} --yes ${IMAGE_DIGEST}
