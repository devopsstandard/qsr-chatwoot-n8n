name: Build, Vulnerability Scan & Cosign KMS Sign

on:
  push:
    branches: [ main, dev ]
    tags: [ 'v*' ]

permissions:
  contents: read
  id-token: write

env:
  GCP_REGION: us-central1
  GCP_PROJECT: ${{ secrets.GCP_PROJECT_ID || 'festive-ally-443007-r4' }}
  GCP_PROJECT_NUMBER: ${{ secrets.GCP_PROJECT_NUMBER || '1056322721883' }}

jobs:
  build-scan-sign:
    name: Build, Scan & Cosign KMS Sign
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [chatwoot, n8n]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure Dynamic Environment Context
        run: |
          ENV_NAME="${{ github.ref_name == 'main' && 'prod' || 'dev' }}"
          echo "ENV_NAME=${ENV_NAME}" >> $GITHUB_ENV
          echo "AR_REPOSITORY=${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT }}/qsr-containers-${ENV_NAME}" >> $GITHUB_ENV
          echo "WIF_PROVIDER=projects/${{ env.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github-actions-pool-${ENV_NAME}/providers/github-actions-provider" >> $GITHUB_ENV
          echo "WIF_SERVICE_ACCOUNT=qsr-cicd-sa-${ENV_NAME}@${{ env.GCP_PROJECT }}.iam.gserviceaccount.com" >> $GITHUB_ENV
          echo "KMS_KEY_ID=gcpkms://projects/${{ env.GCP_PROJECT }}/locations/${{ env.GCP_REGION }}/keyRings/qsr-keyring-${ENV_NAME}/cryptoKeys/cosign-signing-key/cryptoKeyVersions/1" >> $GITHUB_ENV

      - name: Authenticate to GCP via Workload Identity Federation (WIF)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}
          token_format: 'access_token'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GCP Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GCP_REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Build & Push Docker Container Image
        id: build-push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ env.AR_REPOSITORY }}/${{ matrix.service }}:${{ env.ENV_NAME }}
            ${{ env.AR_REPOSITORY }}/${{ matrix.service }}:${{ github.sha }}

      - name: Vulnerability Scan (Trivy CVE Gating)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.AR_REPOSITORY }}/${{ matrix.service }}:${{ env.ENV_NAME }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Install Sigstore Cosign
        uses: sigstore/cosign-installer@v3.5.0

      - name: Sign Container Image with Cloud KMS (Cosign)
        run: |
          echo "==> Signing image: ${{ env.AR_REPOSITORY }}/${{ matrix.service }}:${{ env.ENV_NAME }} with KMS key..."
          cosign sign --key ${{ env.KMS_KEY_ID }} --yes ${{ env.AR_REPOSITORY }}/${{ matrix.service }}:${{ env.ENV_NAME }}
