name: Continuous Deployment (GKE GitOps Rollout)

on:
  workflow_run:
    workflows: ["Build, Vulnerability Scan & Cosign KMS Sign"]
    types: [completed]
    branches: [ main, dev ]

permissions:
  contents: read
  id-token: write

env:
  GCP_REGION: us-central1
  GCP_PROJECT: festive-ally-443007-r4
  GKE_CLUSTER: qsr-gke-cluster-dev
  WIF_PROVIDER: projects/1056322721883/locations/global/workloadIdentityPools/github-actions-pool-dev/providers/github-actions-provider
  WIF_SERVICE_ACCOUNT: qsr-cicd-sa-dev@festive-ally-443007-r4.iam.gserviceaccount.com

jobs:
  deploy-to-gke:
    name: Kustomize Rollout to GKE
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to GCP via WIF
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}

      - name: Get GKE Credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GCP_REGION }}

      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Apply Kustomize Overlay
        run: |
          ENVIRONMENT="${{ github.ref_name == 'main' && 'prod' || 'dev' }}"
          echo "==> Deploying to GKE environment: ${ENVIRONMENT}"
          kustomize build k8s/overlays/${ENVIRONMENT} | kubectl apply -f -

      - name: Verify Rollout Status
        run: |
          kubectl rollout status deployment/chatwoot-web -n default --timeout=180s
          kubectl rollout status deployment/chatwoot-worker -n default --timeout=180s
          kubectl rollout status deployment/n8n-main -n default --timeout=180s
          kubectl rollout status deployment/n8n-worker -n default --timeout=180s
