name: Continuous Deployment (GKE GitOps Rollout)

on:
  workflow_run:
    workflows: ["Build, Vulnerability Scan & Cosign KMS Sign"]
    types: [completed]
    branches: [ main, dev ]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  GCP_REGION: us-central1

jobs:
  deploy-to-gke:
    name: Kustomize Rollout to GKE
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure Dynamic Environment Context
        run: |
          PROJ_ID="${{ secrets.GCP_PROJECT_ID }}"
          if [ -z "$PROJ_ID" ]; then PROJ_ID="festive-ally-443007-r4"; fi
          echo "GCP_PROJECT=${PROJ_ID}" >> $GITHUB_ENV

          PROJ_NUM="${{ secrets.GCP_PROJECT_NUMBER }}"
          if [ -z "$PROJ_NUM" ]; then PROJ_NUM="1056322721883"; fi
          echo "GCP_PROJECT_NUMBER=${PROJ_NUM}" >> $GITHUB_ENV

          HEAD_BRANCH="${{ github.event.workflow_run.head_branch || github.ref_name }}"
          if [ "$HEAD_BRANCH" = "main" ] || [ "$HEAD_BRANCH" = "refs/heads/main" ]; then
            ENV_NAME="prod"
          else
            ENV_NAME="dev"
          fi
          echo "ENV_NAME=${ENV_NAME}" >> $GITHUB_ENV
          echo "GKE_CLUSTER=qsr-gke-cluster-${ENV_NAME}" >> $GITHUB_ENV
          echo "WIF_PROVIDER=projects/${PROJ_NUM}/locations/global/workloadIdentityPools/github-actions-pool-${ENV_NAME}/providers/github-actions-provider" >> $GITHUB_ENV
          echo "WIF_SERVICE_ACCOUNT=qsr-cicd-sa-${ENV_NAME}@${PROJ_ID}.iam.gserviceaccount.com" >> $GITHUB_ENV

      - name: Authenticate to GCP (WIF with SA Key Bootstrap Fallback)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          workload_identity_provider: ${{ secrets.GCP_SA_KEY == '' && env.WIF_PROVIDER || '' }}
          service_account: ${{ secrets.GCP_SA_KEY == '' && env.WIF_SERVICE_ACCOUNT || '' }}

      - name: Get GKE Credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GCP_REGION }}-a

      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Ensure KEDA CRDs & Operator
        run: |
          if ! kubectl get crd scaledobjects.keda.sh >/dev/null 2>&1; then
            echo "==> Installing KEDA CRDs & controller on cluster..."
            kubectl apply --server-side -f https://github.com/kedacore/keda/releases/download/v2.14.0/keda-2.14.0.yaml
          else
            echo "==> KEDA is already installed on the cluster."
          fi

      - name: Apply Kustomize Overlay
        run: |
          echo "==> Deploying to GKE environment: ${ENV_NAME}"
          kustomize build k8s/overlays/${ENV_NAME} | kubectl apply -f -

      - name: Verify Rollout Status
        run: |
          echo "==> Verifying rollout status for all deployments..."
          kubectl rollout status deployment/${ENV_NAME}-chatwoot-web -n default --timeout=300s
          kubectl rollout status deployment/${ENV_NAME}-chatwoot-worker -n default --timeout=300s
          kubectl rollout status deployment/${ENV_NAME}-n8n-main -n default --timeout=300s
          kubectl rollout status deployment/${ENV_NAME}-n8n-worker -n default --timeout=300s

      - name: Inspect Workloads and Ingress
        if: always()
        run: |
          echo "==> Current Pods:"
          kubectl get pods -n default -o wide
          echo "==> Current Ingress:"
          kubectl get ingress -n default
